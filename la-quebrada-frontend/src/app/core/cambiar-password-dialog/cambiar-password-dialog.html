<p-dialog header="Cambiar contraseña" [(visible)]="visible" [modal]="true" [style]="{ width: '420px' }" appendTo="body">
  @if (exito()) {
    <p-message severity="success" text="Contraseña actualizada." />
    <div class="acciones">
      <p-button label="Cerrar" (onClick)="cerrar()" />
    </div>
  } @else {
    <div class="field">
      <label>Contraseña actual</label>
      <input pInputText type="password" autocomplete="current-password" [(ngModel)]="actual" fluid />
    </div>
    <div class="field">
      <label>Contraseña nueva (mínimo 8 caracteres)</label>
      <input pInputText type="password" autocomplete="new-password" [(ngModel)]="nueva" fluid />
    </div>
    <div class="field">
      <label>Repetir contraseña nueva</label>
      <input pInputText type="password" autocomplete="new-password" [(ngModel)]="confirmar" fluid />
    </div>

    @if (error()) {
      <p-message severity="error" [text]="error()!" />
    }

    <div class="acciones">
      <p-button label="Cancelar" severity="secondary" (onClick)="cerrar()" />
      <p-button label="Guardar" [loading]="cargando()" [disabled]="!actual || !nueva || !confirmar" (onClick)="guardar()" />
    </div>
  }
</p-dialog>
