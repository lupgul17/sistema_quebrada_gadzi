<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img [src]="temaService.oscuro() ? '/brand/logo-claro.png' : '/brand/logo.png'" alt="La Quebrada" />
    </div>
    <nav class="sidebar-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/clientes" routerLinkActive="active">Clientes</a>
      <a routerLink="/eventos" routerLinkActive="active">Eventos</a>
      <a routerLink="/pagos" routerLinkActive="active" class="nav-item-con-badge">
        Pagos
        @if (pagosPendientesService.count() > 0) {
          <span class="badge-pendiente">{{ pagosPendientesService.count() }}</span>
        }
      </a>
      <a routerLink="/servicios" routerLinkActive="active">Servicios</a>
      <a routerLink="/menu" routerLinkActive="active">Menú</a>
      <a routerLink="/degustaciones" routerLinkActive="active">Degustaciones</a>
      <a routerLink="/reportes" routerLinkActive="active">Reportes</a>
    </nav>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <h1 class="lq-display">{{ tituloPagina() }}</h1>
      <div class="usuario-info">
        <span>Hola, {{ usuario()?.nombre }}</span>
        <p-button
          [icon]="temaService.oscuro() ? 'pi pi-sun' : 'pi pi-moon'"
          [rounded]="true"
          [text]="true"
          severity="secondary"
          [ariaLabel]="temaService.oscuro() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
          [pTooltip]="temaService.oscuro() ? 'Modo claro' : 'Modo oscuro'"
          tooltipPosition="bottom"
          (onClick)="temaService.alternar()"
        />
        <p-button label="Cerrar sesión" severity="secondary" size="small" [outlined]="true" (onClick)="logout()" />
      </div>
    </header>

    <main class="content-area">
      <router-outlet />
    </main>
  </div>
  <app-visor-archivo-dialog />
  <app-inactividad-dialog />
</div>
