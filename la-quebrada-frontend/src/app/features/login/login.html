<div class="login-container">
  <div class="login-card">
    <h1>La Quebrada / GADZI</h1>
    <p class="subtitle">Iniciá sesión para continuar</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="username">Usuario</label>
        <input pInputText id="username" formControlName="username" fluid  />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
       <p-password id="password" formControlName="password" [feedback]="false" [toggleMask]="true" fluid  />
      </div>

      @if (error()) {
        <p-message severity="error" [text]="error()!" styleClass="w-full mb-3" />
      }

      <p-button type="submit" label="Ingresar" [loading]="cargando()" [disabled]="cargando()" fluid [dt]="loginButtonTokens"/>
    </form>
  </div>
</div>
