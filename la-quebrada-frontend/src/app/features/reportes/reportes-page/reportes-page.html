<div class="reportes-page">
  <div class="filtros">
    <div class="field">
      <label>Reporte</label>
      <p-select [options]="reportes" optionLabel="label" optionValue="value" [(ngModel)]="tipoSeleccionado" appendTo="body" fluid />
    </div>

    @if (reporteActual().necesitaFechas) {
      <div class="field">
        <label>Rango</label>
        <p-select [options]="rangosRapidos" optionLabel="label" optionValue="value" [(ngModel)]="rangoRapido" appendTo="body" fluid />
      </div>

      @if (rangoRapido === 'personalizado') {
        <div class="field">
          <label>Desde</label>
          <p-datepicker [(ngModel)]="fechaDesde" dateFormat="dd/mm/yy" appendTo="body" fluid />
        </div>
        <div class="field">
          <label>Hasta</label>
          <p-datepicker [(ngModel)]="fechaHasta" dateFormat="dd/mm/yy" appendTo="body" fluid />
        </div>
      }
    }

    <p-button label="Generar" [loading]="cargando()" (onClick)="generar()" />
    <p-button label="Descargar PDF" icon="pi pi-file-pdf" severity="secondary" [loading]="descargando()" (onClick)="descargarPdf()" />
  </div>

  <div class="table-container">
    <p-table [value]="filas()" [paginator]="true" [rows]="15" styleClass="p-datatable-sm">
      <ng-template pTemplate="header">
        <tr>
          @for (col of columnas(); track col) {
            <th>{{ col }}</th>
          }
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-fila>
        <tr>
          @for (col of columnas(); track col) {
            <td>{{ fila[col] }}</td>
          }
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr><td [attr.colspan]="columnas().length">Elegí un reporte y presioná "Generar" para ver los datos.</td></tr>
      </ng-template>
    </p-table>
  </div>
</div>
